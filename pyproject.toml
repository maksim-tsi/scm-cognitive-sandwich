[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-cognitive-sandwich"
version = "0.1.0"
description = "SCM Cognitive Sandwich - LLM and OR Solver Integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "pyomo",
    "highspy",
    "pydantic>=2.0",
    "langchain-groq",
    "langchain-google-genai",
    "langchain-mistralai",
    "httpx",
    "langgraph-checkpoint-redis",
    "arize-phoenix",
    "openinference-instrumentation-langchain",
    "opentelemetry-instrumentation-httpx",
    "python-dotenv",
    "tenacity",
    "pulp>=3.3.0",
    "langchain-openrouter>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
mypy_path = ["src"]
python_version = "3.13"
namespace_packages = false
ignore_missing_imports = true
